name: Generate Snake

on:
  schedule:
    # 每天 01:30 UTC 自动刷新贪吃蛇
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        run: node .github/scripts/generate-snake.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAKE_USER: xh0915
          SNAKE_VER: ${{ github.run_number }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 每次生成的文件名带 run_number 版本号，README 指向最新版；URL 永远是新的，绕开一切 CDN 缓存
      - name: Point README to the fresh snake
        run: |
          sed -i -E "s/contribution-snake-dark(\.[0-9]+)?\.svg/contribution-snake-dark.${{ github.run_number }}.svg/g" README.md
          sed -i -E "s/contribution-snake-light(\.[0-9]+)?\.svg/contribution-snake-light.${{ github.run_number }}.svg/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: refresh contribution snake to run ${{ github.run_number }} [skip ci]"
          git push
