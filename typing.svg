<svg xmlns="http://www.w3.org/2000/svg" width="330" height="70" viewBox="0 0 330 70" role="img" aria-label="欢迎来到我的世界">
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="55%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <mask id="tm">
      <rect x="0" y="0" height="70" fill="#ffffff">
        <animate
          attributeName="width"
          calcMode="discrete"
          values="0;36;72;108;144;180;216;252;288;288;288;288;288;252;216;180;144;108;72;36;0"
          dur="13s"
          repeatCount="indefinite"/>
      </rect>
    </mask>
    <style>
      .tw { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Ubuntu, sans-serif; font-size: 32px; font-weight: 700; }
      .cur { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- 渐变打字文本，遮罩逐字揭示实现打字效果 -->
  <g mask="url(#tm)">
    <text class="tw" x="10" y="46" fill="url(#tg)">欢迎来到我的世界</text>
  </g>

  <!-- 闪烁光标 -->
  <rect class="cur" x="272" y="16" width="4" height="34" rx="1" fill="#2f81f7"/>
</svg>
